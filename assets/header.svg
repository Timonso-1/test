<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" fill="none" role="img" aria-labelledby="t">
<title id="t">Timonso. Minecraft plugin developer from Germany. Paper and Velocity plugins in Kotlin.</title>
<style>
  .name { font: 700 46px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #FAFAFA; letter-spacing: -1px; }
  .sub  { font: 400 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #A1A1AA; }
  .tag  { font: 500 12px 'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace; fill: #FAFAFA; }
  .mono { font: 400 13px 'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace; fill: #A1A1AA; }
  .hi   { fill: #FAFAFA; }
  .dim  { fill: #52525B; }
  .ok   { font-weight: 700; fill: #FAFAFA; }
  .line { animation: in .4s ease-out backwards; }
  .cur  { animation: blink 1.1s steps(1) infinite; }
  @keyframes in { from { opacity: 0; } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .line, .cur { animation: none; } }
</style>

<rect x="0.5" y="0.5" width="999" height="229" rx="12" fill="#09090B" stroke="#27272A"/>

<!-- left: name + intro -->
<text x="44" y="86" class="name">Timonso</text>
<rect x="46" y="104" width="40" height="3" rx="1.5" fill="#FAFAFA"/>
<text x="44" y="140" class="sub">Minecraft plugin developer from Germany.</text>
<text x="44" y="164" class="sub">Paper &amp; Velocity plugins in Kotlin.</text>

<g transform="translate(44,184)">
  <rect width="96" height="24" rx="12" stroke="#3F3F46"/><text x="48" y="16" class="tag" text-anchor="middle">Kotlin</text>
  <rect x="104" width="86" height="24" rx="12" stroke="#3F3F46"/><text x="147" y="16" class="tag" text-anchor="middle">Paper</text>
  <rect x="198" width="96" height="24" rx="12" stroke="#3F3F46"/><text x="246" y="16" class="tag" text-anchor="middle">Velocity</text>
  <rect x="302" width="106" height="24" rx="12" stroke="#3F3F46"/><text x="355" y="16" class="tag" text-anchor="middle">Surf-API</text>
</g>

<!-- right: terminal window -->
<g transform="translate(560,32)">
  <rect x="0.5" y="0.5" width="399" height="165" rx="8" fill="#0F0F12" stroke="#27272A"/>
  <line x1="0.5" y1="30.5" x2="399.5" y2="30.5" stroke="#27272A"/>
  <circle cx="18" cy="15.5" r="5" fill="#3F3F46"/>
  <circle cx="34" cy="15.5" r="5" fill="#3F3F46"/>
  <circle cx="50" cy="15.5" r="5" fill="#3F3F46"/>
  <text x="200" y="20" class="mono dim" text-anchor="middle">timonso@dev ~</text>

  <text x="18" y="58" class="mono line" style="animation-delay:.2s"><tspan class="dim">$</tspan> <tspan class="hi">./gradlew build</tspan></text>
  <text x="18" y="80" class="mono line" style="animation-delay:.6s">&gt; Task :compileKotlin</text>
  <text x="18" y="100" class="mono line" style="animation-delay:.9s">&gt; Task :shadowJar</text>
  <text x="18" y="124" class="mono line" style="animation-delay:1.3s"><tspan class="ok">BUILD SUCCESSFUL</tspan> in 8s</text>
  <text x="18" y="150" class="mono line" style="animation-delay:1.6s"><tspan class="dim">$</tspan></text>
  <rect x="34" y="139" width="8" height="15" fill="#FAFAFA" class="cur"/>
</g>
</svg>
